<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gmail Earn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md">
            <!-- Logo/Header -->
            <div class="text-center mb-8">
                <div class="inline-block bg-indigo-600 rounded-full p-4 mb-4">
                    <i class="fas fa-envelope text-white text-3xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-800">Gmail Earn</h1>
                <p class="text-gray-600 text-sm mt-2">Earn Money by Creating Gmail Accounts</p>
            </div>

            <!-- Login Form -->
            <form method="POST" class="space-y-5">
                <!-- Email Input -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2" for="email">
                        <i class="fas fa-envelope text-indigo-600"></i> Email Address
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="you@example.com" 
                        required
                        class="w-full border-2 border-gray-300 rounded-lg p-3 focus:outline-none focus:border-indigo-500 transition"
                    >
                </div>

                <!-- Password Input -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2" for="password">
                        <i class="fas fa-lock text-indigo-600"></i> Password
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        required
                        class="w-full border-2 border-gray-300 rounded-lg p-3 focus:outline-none focus:border-indigo-500 transition"
                    >
                </div>

                <!-- Error Message -->
                {% if error %}
                <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 rounded">
                    <i class="fas fa-exclamation-circle"></i> {{ error }}
                </div>
                {% endif %}

                <!-- Remember Me -->
                <div class="flex items-center">
                    <input 
                        type="checkbox" 
                        id="remember" 
                        name="remember"
                        class="w-4 h-4 text-indigo-600 rounded"
                    >
                    <label for="remember" class="ml-2 text-sm text-gray-600">
                        Remember me
                    </label>
                </div>

                <!-- Login Button -->
                <button 
                    type="submit" 
                    class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold py-3 rounded-lg hover:shadow-lg transition transform hover:scale-105"
                >
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <!-- Divider -->
            <div class="flex items-center my-6">
                <div class="flex-1 border-t-2 border-gray-300"></div>
                <span class="px-3 text-gray-600 text-sm font-semibold">New User?</span>
                <div class="flex-1 border-t-2 border-gray-300"></div>
            </div>

            <!-- Register Link -->
            <a 
                href="{{ url_for('register') }}" 
                class="block w-full text-center bg-gray-100 text-gray-700 font-semibold py-3 rounded-lg hover:bg-gray-200 transition"
            >
                <i class="fas fa-user-plus"></i> Create New Account
            </a>

            <!-- Info Box -->
            <div class="bg-blue-50 border border-blue-200 text-blue-700 p-4 rounded-lg mt-6 text-sm">
                <p class="font-semibold mb-2">
                    <i class="fas fa-info-circle"></i> Demo Credentials
                </p>
                <p class="text-xs">
                    Use any email and password (min 6 characters) to create an account
                </p>
            </div>
        </div>
    </div>
</body>
</html>
