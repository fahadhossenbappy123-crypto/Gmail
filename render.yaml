services:
  - type: web
    name: gmail-create
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --timeout 60 --workers 2 --worker-class sync
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.13
    routes:
      - path: /
        serviceName: gmail-create
